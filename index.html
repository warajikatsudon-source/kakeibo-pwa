<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>家計簿PWA</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>家計簿</h1>

<div class="card">

<h2>取引登録</h2>

<input type="date" id="date">

<select id="type">
<option value="収入">収入</option>
<option value="支出">支出</option>
</select>

<input type="number" id="amount" placeholder="金額">

<input type="text" id="category" placeholder="カテゴリ">

<input type="text" id="memo" placeholder="メモ">

<button onclick="addRecord()">保存</button>

</div>

<div class="card">

<h2>今月の収支</h2>

<p>収入: ¥<span id="income">0</span></p>

<p>支出: ¥<span id="expense">0</span></p>

<p>残高: ¥<span id="balance">0</span></p>

</div>

<div class="card">

<h2>CSV</h2>

<input type="file" id="csvFile">

<button onclick="importCSV()">
CSV読込
</button>

<button onclick="exportCSV()">
CSV出力
</button>

</div>

<div class="card">
<h2>支出割合</h2>
<canvas id="expenseChart"></canvas>
</div>

<div class="card">
<h2>取引一覧</h2>
<div id="recordList"></div>
</div>

<script src="app.js"></script>

</body>
</html>
